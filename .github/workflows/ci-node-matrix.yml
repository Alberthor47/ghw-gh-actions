name: Node CI Matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-node-matrix.yml"
      - "examples/node-matrix-demo/**"
  pull_request:
    paths:
      - ".github/workflows/ci-node-matrix.yml"
      - "examples/node-matrix-demo/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    defaults:
      run:
        working-directory: examples/node-matrix-demo

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: examples/node-matrix-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
